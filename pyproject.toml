[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pc-info"
version = "1.1.0"
description = "Multiplatform Information System Monitor on a Terminal Using Textual"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Nicolás Breval Rodríguez" }
]
dependencies = [
  "textual>=0.80.0",
  "psutil>=7.0.0",
  "py-cpuinfo>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
pc-info = "pc_info.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pc_info"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]